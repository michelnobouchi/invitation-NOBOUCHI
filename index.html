<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation — NOBOUCHI</title>

<style>
/* =========================

   ANIMATION PREMIUM MOBILE

========================= */

.envelope {

    animation: floatEnvelope 3s ease-in-out infinite;

}

@keyframes floatEnvelope {

    0%, 100% {

        transform: translateY(0);

    }

    50% {

        transform: translateY(-5px);

    }

}

/* Petit mouvement au moment de l'ouverture */

.envelope.open {

    animation: envelopeOpen .45s ease forwards;

}

@keyframes envelopeOpen {

    0% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.025);

    }

    100% {

        transform: scale(1);

    }

}

/* Rabat */

.flap {

    transform-origin: top center;

    backface-visibility: hidden;

    transition:

        transform 1.25s cubic-bezier(.22,.61,.36,1);

}

.envelope.open .flap {

    transform: rotateX(180deg);

}

/* Lettre qui sort */

.letter {

    transition:

        transform 1.35s cubic-bezier(.16,1,.3,1),

        box-shadow 1s ease;

}

.envelope.open .letter {

    transform: translateY(-115px);

    box-shadow: 0 15px 35px rgba(0,0,0,.08);

}

/* Apparition élégante de l'invitation */

.invitation.active {

    animation:

        invitationIn 1s cubic-bezier(.16,1,.3,1) forwards;

}

@keyframes invitationIn {

    0% {

        opacity: 0;

        transform: translateY(35px) scale(.98);

    }

    100% {

        opacity: 1;

        transform: translateY(0) scale(1);

    }

}

/* Sur petits téléphones */

@media (max-width: 380px) {

    .envelope.open .letter {

        transform: translateY(-90px);

    }

    .envelope {

        animation-duration: 3.5s;

    }

}

/* Respecte les réglages d'accessibilité du téléphone */

@media (prefers-reduced-motion: reduce) {

    .envelope {

        animation: none;

    }

    .flap,

    .letter,

    .invitation.active {

        transition: none;

        animation: none;

    }

}
</head>

<body>

<!-- =========================
     ENVELOPPE
========================= -->

<section class="cover" id="cover">

    <div class="cover-content">

        <div class="subtitle">
            Une invitation vous attend
        </div>

        <div class="envelope" id="envelope">

            <div class="envelope-body"></div>

            <div class="letter">
                <div class="letter-title">
                    NOBOUCHI
                </div>

                <div class="letter-subtitle">
                    ANNIVERSAIRE
                </div>
            </div>

            <div class="flap"></div>

        </div>

        <button class="open-button" onclick="openInvitation()">
            OUVRIR L'INVITATION
        </button>

        <div class="touch">
            Touchez pour ouvrir
        </div>

    </div>

</section>


<!-- =========================
     INVITATION
========================= -->

<section class="invitation" id="invitation">

    <div class="card">

        <div class="card-inner">

            <div class="invitation-label">
                Invitation
            </div>

            <h1>
                ANNIVERSAIRE
            </h1>

            <div class="name">
                NOBOUCHI
            </div>

            <div class="line"></div>

            <p class="message">
                J’ai le plaisir de vous inviter à partager
                avec moi un moment de joie et de convivialité
                à l’occasion de mon anniversaire.
            </p>


            <div class="details">

                <div class="detail">

                    <div class="detail-title">
                        Date
                    </div>

                    <div class="detail-value">
                        Samedi 19 septembre 2026
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Heure
                    </div>

                    <div class="detail-value">
                        15h00
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Lieu
                    </div>

                    <div class="detail-value">
                        Derrière Bonne Fontaine<br>
                        Carrefour Le Maire
                    </div>

                </div>

            </div>


            <div class="line"></div>


            <div class="qr-title">
                Localisation
            </div>

            <!-- QR CODE -->
            <img
                class="qr"
                src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fmaps.app.goo.gl%2F5wrGmnecZxiPSMRS6%3Fg_st%3Dic"
                alt="QR Code Google Maps"
            >

            <div class="qr-text">
                Scannez le QR Code pour ouvrir l’itinéraire.
            </div>


            <div class="buttons">

                <a
                    class="button maps"
                    href="https://maps.app.goo.gl/5wrGmnecZxiPSMRS6?g_st=ic"
                    target="_blank">
                    Ouvrir Maps
                </a>

                <a
                    class="button whatsapp"
                    href="https://wa.me/?text=Bonjour%20NOBOUCHI%2C%20je%20confirme%20ma%20présence%20à%20ton%20anniversaire%20du%2019%20septembre%202026."
                    target="_blank">
                    Confirmer
                </a>

            </div>


            <button
                class="replay"
                onclick="replayInvitation()">

                ↻ REVENIR À L'ENVELOPPE

            </button>


            <div class="footer">
                Invitation personnelle — NOBOUCHI
            </div>

        </div>

    </div>

</section>


<script>

function openInvitation() {

    const envelope =
        document.getElementById("envelope");

    envelope.classList.add("open");

    setTimeout(function() {

        document.getElementById("cover")
        .style.display = "none";

        document.getElementById("invitation")
        .classList.add("active");

        window.scrollTo(0,0);

    }, 1200);
}


function replayInvitation() {

    document.getElementById("invitation")
    .classList.remove("active");

    document.getElementById("invitation")
    .style.display = "none";

    document.getElementById("cover")
    .style.display = "flex";

    document.getElementById("envelope")
    .classList.remove("open");

    window.scrollTo(0,0);
}

</script>

</body>
</html>
