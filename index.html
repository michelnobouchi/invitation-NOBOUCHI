<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation Anniversaire NOBOUCHI</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', Times, serif; /* Pour le style NOBOUCHI */
            text-align: center;
            background-color: white; /* Ou la couleur de votre fond */
        }

        /* Conteneur principal qui centre tout */
        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 90%; /* Pour pas que ça colle aux bords sur mobile */
            width: 100%;
        }

        /* Titre "UNE INVITATION VOUS ATTEND" */
        .invitation-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px; /* Espace avant la carte */
            color: #555; /* Gris clair */
        }

        /* La carte (cadre blanc) */
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 30px; /* Espace avant le bouton */
            max-width: 300px; /* Largeur de la carte */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .nobouchi-text {
            font-size: 28px;
            letter-spacing: 4px;
            margin: 0;
        }

        .anniversaire-text {
            font-size: 14px;
            letter-spacing: 2px;
            color: #333;
            margin-top: 5px;
        }

        /* Le bouton "OUVRIR L'INVITATION" */
        .open-button {
            display: inline-block;
            background-color: #000;
            color: #fff;
            text-transform: uppercase;
            padding: 15px 30px;
            border-radius: 25px; /* Pour le look arrondi */
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .touch-to-open {
            margin-top: 10px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="invitation-title">UNE INVITATION VOUS ATTEND</div>

    <div class="card">
        <h1 class="nobouchi-text">NOBOUCHI</h1>
        <p class="anniversaire-text">ANNIVERSAIRE</p>
    </div>

    <a href="#" class="open-button">OUVRIR L'INVITATION</a>
    <p class="touch-to-open">Touchez pour ouvrir</p>
</div>

</body>
</html>
